databaseChangeLog:
  - changeSet:
      id: add-categories-to-categories-table
      author: olha-hirniak
      changes:
        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Fantasy
              - column:
                  name: description
                  value: Magic, myths, and imaginary worlds
              - column:
                  name: is_deleted
                  valueBoolean: false
        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Science Fiction
              - column:
                  name: description
                  value: Future technology and space
              - column:
                  name: is_deleted
                  valueBoolean: false
